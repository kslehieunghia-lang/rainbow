<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Mimi"/>
<meta name="theme-color" content="#FFF0F5"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>Mimi English</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#F48FB1;--pink-light:#FCE4EC;--pink-deep:#D4537E;
  --purple:#CE93D8;--purple-light:#F3E5F5;
  --bg:#FFF0F5;--text:#3a1a2e;--text2:#7a4a65;--text3:#b08090;
  --shadow:0 2px 10px rgba(212,83,126,0.13);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text)}

#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF0F5 0%,#FCE4EC 100%)}

/* HEADER */
.header{flex:0 0 auto;padding:env(safe-area-inset-top,0px) 0 0}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.app-title{font-size:17px;font-weight:800;color:var(--pink-deep)}
.mode-pill{background:white;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--text3);box-shadow:var(--shadow)}
.settings-btn{width:36px;height:36px;border-radius:50%;border:none;background:white;box-shadow:var(--shadow);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.toggle-group{display:flex;background:white;border-radius:999px;padding:2px;gap:2px;box-shadow:var(--shadow)}
.toggle-btn{padding:5px 10px;border-radius:999px;border:none;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);white-space:nowrap}
.toggle-btn.active{background:var(--pink);color:white}

/* STAGE */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 16px}

/* Speech bubble */
.speech-bubble{position:relative;background:white;border-radius:20px;padding:12px 18px;max-width:88%;min-height:48px;box-shadow:0 4px 18px rgba(212,83,126,0.18);font-size:15px;font-weight:700;line-height:1.5;color:var(--text);text-align:center;margin-bottom:10px;opacity:0;transform:translateY(6px) scale(.97);transition:opacity .3s ease,transform .3s ease;word-break:break-word}
.speech-bubble.show{opacity:1;transform:translateY(0) scale(1)}
.speech-bubble::after{content:'';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:white}

/* Lesson card — hiện câu tiếng Anh đang dạy */
.lesson-card{background:linear-gradient(135deg,#3C3489,#6a5acd);border-radius:16px;padding:12px 20px;max-width:88%;text-align:center;margin-bottom:10px;box-shadow:0 6px 20px rgba(60,52,137,0.3);opacity:0;transform:scale(.95);transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.lesson-card.show{opacity:1;transform:scale(1)}
.lesson-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.lesson-text{font-size:18px;font-weight:800;color:white;line-height:1.4;letter-spacing:.01em}

/* User echo */
.user-echo{font-size:12px;font-weight:600;color:var(--text3);background:var(--pink-light);border-radius:999px;padding:4px 14px;margin-bottom:10px;max-width:80%;text-align:center;opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-echo.show{opacity:1}

/* Bunny */
.bunny-wrap{position:relative;display:flex;align-items:center;justify-content:center}
#character{filter:drop-shadow(0 8px 20px rgba(212,83,126,0.25))}
#character.hop   {animation:hop .4s ease-in-out infinite alternate}
#character.wiggle{animation:wiggle .5s ease-in-out infinite alternate}
#character.bounce{animation:bounce .45s ease-in-out infinite alternate}
#character.shake {animation:shake .4s ease-in-out infinite alternate}
#character.nod   {animation:nod .6s ease-in-out infinite alternate}
@keyframes hop   {to{transform:translateY(-9px)}}
@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake {0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes nod   {from{transform:translateY(0)}to{transform:translateY(-5px)}}
.emotion-bubble{position:absolute;top:0;right:-10px;background:white;border-radius:12px 12px 12px 3px;padding:4px 8px;font-size:18px;box-shadow:var(--shadow);opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.emotion-bubble.show{opacity:1;transform:scale(1)}

/* Status */
.status-pill{margin-top:10px;padding:5px 18px;border-radius:999px;background:white;box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--pink-deep);text-align:center;min-width:160px}

/* MIC */
.controls-area{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--pink-light) 0%,transparent 100%)}
.mic-btn{width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(212,83,126,.45);transition:all .15s;touch-action:manipulation;position:relative}
.mic-btn:active{transform:scale(.9)}
.mic-btn.recording{background:#c62828;animation:pulseMic 1s infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 5px 18px rgba(198,40,40,.35)}50%{box-shadow:0 5px 36px rgba(198,40,40,.7)}}
.mic-btn.auto-waiting::after{content:'';position:absolute;border-radius:50%;width:82px;height:82px;top:-8px;left:-8px;border:3px solid var(--pink);animation:autoRing 1.6s ease-in-out infinite;pointer-events:none}
@keyframes autoRing{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:.15}}
.mic-svg{width:28px;height:28px;fill:white}
.mic-hint{margin-top:6px;font-size:11px;font-weight:700;color:var(--text3)}
.error-msg{margin-top:3px;font-size:11px;font-weight:600;color:#c62828;text-align:center;min-height:14px}

/* PROFILE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(58,26,46,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal-card{background:white;border-radius:24px;padding:28px 24px;width:min(340px,90vw);box-shadow:0 20px 60px rgba(58,26,46,.2);transform:translateY(20px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.show .modal-card{transform:translateY(0)}
.modal-title{font-size:18px;font-weight:800;color:var(--pink-deep);text-align:center;margin-bottom:20px}
.modal-label{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:6px;display:block}
.modal-input{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--pink-light);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;color:var(--text);outline:none;transition:border-color .15s}
.modal-input:focus{border-color:var(--pink)}
.modal-mode{display:flex;gap:8px;margin-top:16px}
.modal-mode-btn{flex:1;padding:10px;border-radius:12px;border:2px solid var(--pink-light);background:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .15s}
.modal-mode-btn.active{background:var(--pink-deep);color:white;border-color:var(--pink-deep)}
.modal-save{width:100%;margin-top:20px;padding:13px;border-radius:14px;border:none;background:var(--pink-deep);color:white;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(212,83,126,.4)}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="top-bar">
      <div class="app-title">🐰 Mimi English</div>
      <div class="toggle-group" id="lang-toggle">
        <button class="toggle-btn active" onclick="setLang('vi',this)">🇻🇳 Việt</button>
        <button class="toggle-btn" onclick="setLang('en',this)">🇬🇧 English</button>
      </div>
      <button class="settings-btn" onclick="openProfile()" aria-label="Cài đặt">⚙️</button>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage">
    <div class="speech-bubble" id="speech-bubble"></div>
    <div class="lesson-card" id="lesson-card">
      <div class="lesson-label">Câu tiếng Anh hôm nay</div>
      <div class="lesson-text" id="lesson-text"></div>
    </div>
    <div class="user-echo" id="user-echo"></div>
    <div class="bunny-wrap">
      <div class="emotion-bubble" id="emotion-bubble">😊</div>
      <svg id="character" width="150" height="172" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="42" cy="38" rx="13" ry="30" fill="#F4C0D1" stroke="#ED93B1" stroke-width="1"/>
        <ellipse cx="42" cy="40" rx="7" ry="22" fill="#FBEAF0"/>
        <ellipse cx="88" cy="38" rx="13" ry="30" fill="#F4C0D1" stroke="#ED93B1" stroke-width="1"/>
        <ellipse cx="88" cy="40" rx="7" ry="22" fill="#FBEAF0"/>
        <ellipse cx="65" cy="68" rx="46" ry="14" fill="#ED93B1"/>
        <path d="M 19 72 Q 16 120 65 124 Q 114 120 111 72 Q 90 82 65 82 Q 40 82 19 72Z" fill="#ED93B1"/>
        <circle cx="65" cy="75" r="38" fill="white" stroke="#F4C0D1" stroke-width="1"/>
        <ellipse id="cheek-l" cx="44" cy="82" rx="9" ry="6" fill="#F4C0D1" opacity="0.7"/>
        <ellipse id="cheek-r" cx="86" cy="82" rx="9" ry="6" fill="#F4C0D1" opacity="0.7"/>
        <g id="eye-left">
          <ellipse id="eye-l-white" cx="54" cy="70" rx="8" ry="9" fill="white"/>
          <ellipse id="eye-l-iris" cx="54" cy="71" rx="5" ry="6" fill="#3C3489"/>
          <circle cx="55.5" cy="69" r="2" fill="white"/>
        </g>
        <g id="eye-right">
          <ellipse id="eye-r-white" cx="76" cy="70" rx="8" ry="9" fill="white"/>
          <ellipse id="eye-r-iris" cx="76" cy="71" rx="5" ry="6" fill="#3C3489"/>
          <circle cx="77.5" cy="69" r="2" fill="white"/>
        </g>
        <path id="brow-l" d="M 47 62 Q 54 59 61 62" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path id="brow-r" d="M 69 62 Q 76 59 83 62" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="65" cy="80" rx="3.5" ry="2.5" fill="#D4537E"/>
        <path id="mouth" d="M 55 86 Q 65 94 75 86" stroke="#D4537E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 48 108 Q 65 118 82 108" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 57 112 Q 60 106 65 110 Q 70 106 73 112 Q 65 116 57 112Z" fill="#D4537E" opacity="0.8"/>
        <circle cx="65" cy="112" r="3" fill="#993556"/>
        <ellipse cx="42" cy="126" rx="12" ry="8" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.5"/>
        <ellipse cx="88" cy="126" rx="12" ry="8" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.5"/>
        <g id="stars" opacity="0"><text x="16" y="54" font-size="13" fill="#FFD700">✦</text><text x="100" y="44" font-size="11" fill="#FFD700">✦</text></g>
        <g id="hearts" opacity="0"><text x="12" y="48" font-size="13">🤍</text><text x="102" y="52" font-size="11">🤍</text></g>
        <g id="zzz" opacity="0"><text x="90" y="50" font-size="11" fill="#9E9E9E" font-weight="bold">z</text><text x="98" y="43" font-size="9" fill="#9E9E9E" font-weight="bold">z</text><text x="104" y="37" font-size="7" fill="#9E9E9E" font-weight="bold">z</text></g>
        <ellipse id="sweat" cx="88" cy="58" rx="0" ry="0" fill="#B3E5FC"/>
      </svg>
    </div>
    <div class="status-pill" id="status-text">Nhấn mic để bắt đầu 🎤</div>
  </div>

  <!-- MIC -->
  <div class="controls-area">
    <button class="mic-btn" id="mic-btn" onclick="toggleRecording()" aria-label="Mic">
      <svg id="mic-icon" class="mic-svg" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/></svg>
    </button>
    <div class="mic-hint" id="mic-hint">Nhấn để bắt đầu</div>
    <div class="error-msg" id="error-msg"></div>
  </div>

</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-card">
    <div class="modal-title">👋 Giới thiệu với Mimi</div>
    <label class="modal-label">Tên bé</label>
    <input class="modal-input" id="input-name" type="text" placeholder="Vd: Gạo Nếp, Bin, Na..."/>
    <div class="modal-mode" id="modal-mode-btns">
      <button class="modal-mode-btn active" onclick="selectModalMode('kid',this)">Bé 👶</button>
      <button class="modal-mode-btn" onclick="selectModalMode('adult',this)">Bố mẹ 👨‍👩‍👧</button>
    </div>
    <button class="modal-save" onclick="saveProfile()">Bắt đầu với Mimi! 🐰</button>
  </div>
</div>

<script>
// ── ICONS ──────────────────────────────────────────────────────────
const MIC_ON  = '<path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/>';
const MIC_OFF = '<line x1="1" y1="1" x2="23" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V5a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>';
const MIC_STOP= '<rect x="6" y="6" width="12" height="12" rx="2" fill="white"/>';

// ── STATE ──────────────────────────────────────────────────────────
let mode='kid', lang='vi', speechLang='vi-VN';
let isRecording=false, isSpeaking=false, isWaiting=false, autoListen=false;
let recognition=null, chatHistory=[];
let idleTimer=null, currentEmotion='happy';
let voices=[], viVoice=null, enVoice=null;
let silenceTimer=null, accumulatedText='';
let bubbleHideTimer=null;
let audioCtx=null;

// Profile từ localStorage
let profile = JSON.parse(localStorage.getItem('mimi-profile') || '{"name":"","mode":"kid"}');
let tempModalMode = profile.mode || 'kid';

// ── PROFILE ────────────────────────────────────────────────────────
function openProfile(){
  g('input-name').value = profile.name || '';
  tempModalMode = profile.mode || 'kid';
  g('modal-mode-btns').querySelectorAll('.modal-mode-btn').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&tempModalMode==='kid')||(i===1&&tempModalMode==='adult'));
  });
  g('profile-modal').classList.add('show');
}
function selectModalMode(m, btn){
  tempModalMode = m;
  g('modal-mode-btns').querySelectorAll('.modal-mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function saveProfile(){
  profile.name = g('input-name').value.trim() || '';
  profile.mode = tempModalMode;
  localStorage.setItem('mimi-profile', JSON.stringify(profile));
  g('profile-modal').classList.remove('show');
  applyProfile();
  resetChat();
}
function setLang(l, btn){
  lang = l;
  speechLang = l==='en' ? 'en-US' : 'vi-VN';
  g('lang-toggle').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadVoices();
  chatHistory = [];
  resetChat();
}
function applyProfile(){
  mode = profile.mode || 'kid';
  g('mode-pill').textContent = mode==='kid' ? 'Bé 👶' : 'Bố mẹ 👨‍👩‍👧';
  loadVoices();
}

// ── UTILS ──────────────────────────────────────────────────────────
function g(id){return document.getElementById(id)}
function setStatus(t){g('status-text').textContent=t}
function setError(t){g('error-msg').textContent=t}
function setMicIcon(html){g('mic-icon').innerHTML=html}

// ── PIP SOUND ──────────────────────────────────────────────────────
function playPip(freq=880, dur=0.12){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.25,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

// ── VOICE SELECTION ────────────────────────────────────────────────
function scoreVoice(v, preferFemale){
  let s=0;
  const n=v.name.toLowerCase();
  if(n.includes('google'))s+=40;
  if(n.includes('microsoft'))s+=30;
  if(preferFemale&&(n.includes('female')||n.includes('zira')||n.includes('samantha')||n.includes('ava')||n.includes('karen')||n.includes('nora')||n.includes('sara')))s+=20;
  return s;
}
function loadVoices(){
  voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;
  const preferFemale=(mode==='kid');
  // Giọng tiếng Việt
  const viPool=voices.filter(v=>v.lang.startsWith('vi'));
  viVoice=viPool.length ? viPool.sort((a,b)=>scoreVoice(b,preferFemale)-scoreVoice(a,preferFemale))[0] : null;
  // Giọng tiếng Anh
  const enPool=voices.filter(v=>v.lang.startsWith('en'));
  enVoice=enPool.length ? enPool.sort((a,b)=>scoreVoice(b,preferFemale)-scoreVoice(a,preferFemale))[0] : null;
}
window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

// ── EMOTIONS ───────────────────────────────────────────────────────
const EMOTIONS={
  happy:    {emoji:'😊',anim:'nod',   mouth:'M 55 86 Q 65 94 75 86',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:0.7,stars:0,hearts:0,sweat:0,zzz:0},
  excited:  {emoji:'🤩',anim:'bounce',mouth:'M 50 84 Q 65 98 80 84',browL:'M 46 60 Q 54 56 62 60',browR:'M 68 60 Q 76 56 84 60',eyeRy:7,eyeCy:70,cheek:1,stars:1,hearts:0,sweat:0,zzz:0},
  surprised:{emoji:'😮',anim:'shake', mouth:'M 58 85 Q 65 95 72 85',browL:'M 46 59 Q 54 55 62 58',browR:'M 68 58 Q 76 55 84 59',eyeRy:8,eyeCy:70,cheek:0.5,stars:0,hearts:0,sweat:1,zzz:0},
  love:     {emoji:'🥰',anim:'nod',   mouth:'M 52 86 Q 65 96 78 86',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:1,stars:0,hearts:1,sweat:0,zzz:0},
  laugh:    {emoji:'😂',anim:'bounce',mouth:'M 50 83 Q 65 99 80 83',browL:'M 46 60 Q 54 56 62 60',browR:'M 68 60 Q 76 56 84 60',eyeRy:3,eyeCy:72,cheek:1,stars:0,hearts:0,sweat:0,zzz:0},
  thinking: {emoji:'🤔',anim:'wiggle',mouth:'M 55 88 Q 63 86 72 90',browL:'M 47 62 Q 54 65 61 62',browR:'M 69 59 Q 76 56 83 62',eyeRy:5,eyeCy:71,cheek:0.5,stars:0,hearts:0,sweat:0,zzz:0},
  listening:{emoji:'👂',anim:'wiggle',mouth:'M 57 88 Q 65 92 73 88',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:0.7,stars:0,hearts:0,sweat:0,zzz:0},
  sleepy:   {emoji:'😴',anim:'',      mouth:'M 57 88 Q 65 90 73 88',browL:'M 47 64 Q 54 62 61 64',browR:'M 69 64 Q 76 62 83 64',eyeRy:3,eyeCy:73,cheek:0.4,stars:0,hearts:0,sweat:0,zzz:1}
};

function applyEmotion(name,showBubble){
  const e=EMOTIONS[name]||EMOTIONS.happy; currentEmotion=name;
  g('mouth').setAttribute('d',e.mouth);
  g('brow-l').setAttribute('d',e.browL); g('brow-r').setAttribute('d',e.browR);
  ['l','r'].forEach(s=>{
    g('eye-'+s+'-iris').setAttribute('ry',e.eyeRy); g('eye-'+s+'-white').setAttribute('ry',e.eyeRy+3);
    g('eye-'+s+'-iris').setAttribute('cy',e.eyeCy); g('eye-'+s+'-white').setAttribute('cy',e.eyeCy);
  });
  g('cheek-l').setAttribute('opacity',e.cheek); g('cheek-r').setAttribute('opacity',e.cheek);
  g('stars').setAttribute('opacity',e.stars); g('hearts').setAttribute('opacity',e.hearts);
  g('zzz').setAttribute('opacity',e.zzz);
  g('sweat').setAttribute('rx',e.sweat?4:0); g('sweat').setAttribute('ry',e.sweat?6:0);
  const c=g('character'); c.className.baseVal='';
  if(e.anim){void c.offsetWidth; c.classList.add(e.anim);}
  if(showBubble){
    const b=g('emotion-bubble'); b.textContent=e.emoji; b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'),1800);
  }
}

function detectEmotion(text){
  const t=text.toLowerCase();
  if(/giỏi|tuyệt|xuất sắc|hay lắm|đúng rồi|great|excellent|well done|good job|amazing|wonderful/.test(t))return'excited';
  if(/yêu|thương|gia đình|love|family|friend|cute/.test(t))return'love';
  if(/haha|hihi|buồn cười|funny|laugh|hehe/.test(t))return'laugh';
  if(/ồ|ôi|wow|ngạc nhiên|oh|whoa|really/.test(t))return'surprised';
  return'happy';
}
function extractEmotionTag(text){const m=text.match(/\[(happy|excited|surprised|love|laugh)\]/i);return m?m[1].toLowerCase():null}
function stripEmotionTag(text){return text.replace(/\[(happy|excited|surprised|love|laugh)\]/gi,'').trim()}

// ── EN TAG — câu tiếng Anh cần hiển thị trên màn hình ─────────────
function extractEN(text){
  const m=text.match(/\[EN\]([\s\S]*?)\[\/EN\]/i);
  return m?m[1].trim():null;
}
function stripEN(text){
  return text.replace(/\[EN\]([\s\S]*?)\[\/EN\]/gi,'$1').trim();
}


// ── SPEECH BUBBLE ──────────────────────────────────────────────────
function showSpeechBubble(text){
  clearTimeout(bubbleHideTimer);
  const b=g('speech-bubble');
  b.textContent=text; void b.offsetWidth; b.classList.add('show');
}
function hideSpeechBubble(delay){
  clearTimeout(bubbleHideTimer);
  bubbleHideTimer=setTimeout(()=>g('speech-bubble').classList.remove('show'),delay||3000);
}
function showLessonCard(text){
  g('lesson-text').textContent=text;
  g('lesson-card').classList.add('show');
}
function hideLessonCard(){g('lesson-card').classList.remove('show')}
function showUserEcho(text){
  const e=g('user-echo'); e.textContent='🗣 '+text; e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),3000);
}

// ── IDLE ───────────────────────────────────────────────────────────
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>applyEmotion('sleepy',true),40000);
}

// ── MIC UI ─────────────────────────────────────────────────────────
function updateMicUI(){
  const btn=g('mic-btn'); const hint=g('mic-hint');
  if(isSpeaking){
    btn.classList.remove('recording','auto-waiting'); setMicIcon(MIC_STOP);
    hint.textContent='Nhấn để ngắt';
  } else if(isRecording){
    btn.classList.add('recording'); btn.classList.remove('auto-waiting'); setMicIcon(MIC_OFF);
    hint.textContent='🎙 Đang nghe...';
  } else if(autoListen){
    btn.classList.remove('recording'); btn.classList.add('auto-waiting'); setMicIcon(MIC_ON);
    hint.textContent='Tự động nghe 🔄';
  } else {
    btn.classList.remove('recording','auto-waiting'); setMicIcon(MIC_ON);
    hint.textContent='Nhấn để bắt đầu';
  }
}

// ── TOGGLE MIC ─────────────────────────────────────────────────────
function toggleRecording(){
  if(isWaiting) return;
  if(isSpeaking){
    window.speechSynthesis.cancel(); isSpeaking=false;
    applyEmotion('happy',false);
    if(autoListen) setTimeout(startAutoRecognition,400);
    else updateMicUI();
    return;
  }
  if(autoListen){
    autoListen=false;
    if(recognition){try{recognition.stop();}catch(e){}}
    isRecording=false;
    setStatus('Đã tắt tự nghe');
    updateMicUI(); return;
  }
  // Bật auto-listen
  autoListen=true;
  startAutoRecognition();
  resetIdleTimer();
}

// ── AUTO RECOGNITION ───────────────────────────────────────────────
function startAutoRecognition(){
  if(!autoListen||isWaiting||isSpeaking||isRecording) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setError('Vui lòng dùng Chrome.'); autoListen=false; updateMicUI(); return;}
  setError('');
  try{
    recognition=new SR();
    recognition.lang=speechLang;
    recognition.continuous=true;
    recognition.interimResults=true;

    recognition.onstart=function(){
      isRecording=true; accumulatedText='';
      applyEmotion('listening',false);
      setStatus('🎙 Đang nghe...');
      hideSpeechBubble(300);
      updateMicUI();
    };

    recognition.onresult=function(e){
      let newFinal='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) newFinal+=e.results[i][0].transcript;
      }
      if(!newFinal) return;
      accumulatedText+=newFinal;
      clearTimeout(silenceTimer);
      silenceTimer=setTimeout(()=>{
        const text=accumulatedText.trim();
        if(!text) return;
        accumulatedText='';
        try{recognition.stop();}catch(err){}
        isRecording=false;
        showUserEcho(text);
        callAI(text);
        resetIdleTimer();
        updateMicUI();
      },500);
    };

    recognition.onerror=function(e){
      clearTimeout(silenceTimer); accumulatedText=''; isRecording=false;
      if(e.error==='not-allowed'){autoListen=false; setError('Cần cấp quyền micro.');}
      updateMicUI();
      if(autoListen&&!isWaiting&&!isSpeaking&&e.error!=='not-allowed') setTimeout(startAutoRecognition,400);
    };

    recognition.onend=function(){
      clearTimeout(silenceTimer); isRecording=false; updateMicUI();
      if(autoListen&&!isWaiting&&!isSpeaking) setTimeout(startAutoRecognition,350);
    };

    recognition.start();
  }catch(err){
    isRecording=false;
    if(autoListen&&!isWaiting&&!isSpeaking) setTimeout(startAutoRecognition,500);
  }
}

// ── CALL AI ────────────────────────────────────────────────────────
function callAI(userText){
  if(isWaiting) return;
  isWaiting=true;
  applyEmotion('thinking',true);
  showSpeechBubble('Mimi đang nghĩ... 💭');

  chatHistory.push({role:'user',content:userText});
  if(chatHistory.length>20) chatHistory=chatHistory.slice(-20);

  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      mode, lang,
      childName: profile.name||'bé',
      messages: chatHistory.slice()
    })
  })
  .then(r=>r.json())
  .then(function(result){
    isWaiting=false;
    let raw=result.text||'Mimi chưa nghe rõ, thử lại nhé!';
    const tag=extractEmotionTag(raw);
    let clean=stripEmotionTag(raw);
    const enPhrase=extractEN(clean);
    clean=stripEN(clean);

    applyEmotion(tag||detectEmotion(clean),true);

    // Hiện lesson card nếu có câu tiếng Anh
    if(enPhrase){
      showLessonCard(enPhrase);
      // Chỉ hiện bubble khi có nội dung tiếng Việt đáng kể
      const viPart=clean.replace(enPhrase,'').trim();
      if(viPart.length>5) showSpeechBubble(viPart);
      else hideSpeechBubble(100);
    } else {
      hideLessonCard();
      // Trò chuyện thường → bubble ngắn rồi ẩn
      showSpeechBubble(clean);
      hideSpeechBubble(4000);
    }

    chatHistory.push({role:'assistant',content:clean+(enPhrase?` [EN]${enPhrase}[/EN]`:'')});
    setStatus('🔊 Mimi đang nói...');
    speak(clean+(enPhrase?' '+enPhrase:''));
  })
  .catch(function(){
    isWaiting=false;
    showSpeechBubble('Có lỗi kết nối, thử lại nhé!');
    applyEmotion('surprised',true); setStatus(''); hideSpeechBubble(4000);
    updateMicUI();
  });
}

// ── SPEAK ──────────────────────────────────────────────────────────
function buildChunks(text){
  const chunks=[];
  const sentences=text.split(/(?<=[.!?…])\s+|(?<=[.!?…])$/).filter(s=>s.trim());
  if(!sentences.length) return [{text:text.trim(),pause:400}];
  sentences.forEach(sentence=>{
    const s=sentence.trim(); if(!s) return;
    let endPause=420;
    if(s.endsWith('!')) endPause=320;
    if(s.endsWith('?')) endPause=520;
    if(s.endsWith('...')||s.endsWith('…')) endPause=750;
    const parts=s.split(/,\s*/);
    if(parts.length>1&&s.split(' ').length>6){
      parts.forEach((p,i)=>{const t=p.trim();if(t)chunks.push({text:t,pause:i===parts.length-1?endPause:210});});
    } else {
      chunks.push({text:s,pause:endPause});
    }
  });
  return chunks.length?chunks:[{text:text.trim(),pause:400}];
}

function speak(text){
  window.speechSynthesis.cancel();
  const chunks=buildChunks(text);
  let idx=0;

  // Detect tiếng Anh thuần: không có dấu tiếng Việt + phần lớn là ký tự Latin
  function isEnglishChunk(text){
    const hasViet=/[àáạảãăắặẳẵâấậẩẫèéẹẻẽêếệểễìíịỉĩòóọỏõôốộổỗơớợởỡùúụủũưứựửữỳýỵỷỹđ]/i.test(text);
    if(hasViet) return false;
    const latin=(text.match(/[a-zA-Z]/g)||[]).length;
    return latin/Math.max(text.replace(/\s/g,'').length,1)>0.55;
  }

  function speakNext(){
    if(idx>=chunks.length){
      isSpeaking=false;
      if(currentEmotion!=='sleepy') applyEmotion('happy',false);
      hideSpeechBubble(6000);
      resetIdleTimer();
      updateMicUI();
      playPip(660,0.1);
      if(autoListen) setTimeout(startAutoRecognition,500);
      else setStatus('Nhấn mic để trả lời! 🎤');
      return;
    }
    const {text:chunk,pause}=chunks[idx++];
    if(!chunk){speakNext();return;}
    const u=new SpeechSynthesisUtterance(chunk);

    // Gán đúng ngôn ngữ và giọng cho từng đoạn
    if(isEnglishChunk(chunk)){
      u.lang='en-US';
      if(enVoice) u.voice=enVoice;
    } else {
      u.lang='vi-VN';
      if(viVoice) u.voice=viVoice;
      // Không có giọng vi → dùng giọng mặc định, đừng dùng enVoice
    }

    if(mode==='kid'){u.rate=0.78;u.pitch=1.28;}
    else{u.rate=0.90;u.pitch=1.05;}
    if(currentEmotion==='excited'||currentEmotion==='laugh'){u.rate+=0.07;u.pitch+=0.12;}
    if(currentEmotion==='sleepy'){u.rate-=0.13;u.pitch-=0.1;}
    if(currentEmotion==='surprised'){u.pitch+=0.18;}

    u.onend=function(){setTimeout(speakNext,pause);};
    u.onerror=function(){speakNext();};
    window.speechSynthesis.speak(u);
  }

  isSpeaking=true;
  updateMicUI();
  speakNext();
}

// ── RESET CHAT ─────────────────────────────────────────────────────
function resetChat(){
  autoListen=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  isRecording=false; isSpeaking=false;
  window.speechSynthesis.cancel();
  chatHistory=[];
  hideLessonCard();

  const name=profile.name||'bé';
  let greet='';
  if(mode==='kid'){
    greet=`Chào ${name}! Mình là Mimi 🌈 Mình có thể trò chuyện, kể chuyện, và dạy tiếng Anh cho ${name}! Hôm nay ${name} muốn nói về gì? Con vật, siêu anh hùng, hay khoa học?`;
  } else {
    greet=`Chào ba mẹ! Con là Mimi 🌈 Bạn của ${name}. Con giúp ba mẹ giao tiếp tiếng Anh tự nhiên với con nhé!`;
  }

  showSpeechBubble(greet);
  hideSpeechBubble(8000);
  setStatus('Nhấn mic để bắt đầu 🎤');
  setError(''); applyEmotion('happy',false);
  updateMicUI(); resetIdleTimer();

  // Đọc lời chào
  setTimeout(()=>speak(greet),300);
}

// ── INIT ───────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}

applyProfile();

// Nếu chưa có profile → mở modal ngay
if(!profile.name){
  openProfile();
} else {
  applyEmotion('happy',false);
  resetChat();
  resetIdleTimer();
}
