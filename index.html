<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#F48FB1;--pink-light:#FCE4EC;--pink-deep:#D4537E;
  --purple:#CE93D8;--purple-light:#F3E5F5;
  --bg:#FFF0F5;--text:#3a1a2e;--text2:#7a4a65;--text3:#b08090;
  --shadow:0 2px 10px rgba(212,83,126,0.13);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text)}

#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFF0F5 0%,#FCE4EC 100%);
}

/* HEADER */
.header{flex:0 0 auto;background:transparent;padding:env(safe-area-inset-top,0px) 0 0}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;gap:6px}
.app-title{font-size:17px;font-weight:800;color:var(--pink-deep);flex-shrink:0}
.toggle-group{display:flex;background:white;border-radius:999px;padding:2px;gap:2px;box-shadow:var(--shadow)}
.toggle-btn{padding:5px 11px;border-radius:999px;border:none;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);white-space:nowrap}
.toggle-btn.active{background:var(--pink);color:white}
.tab-bar{display:flex;padding:2px 14px 8px;gap:6px}
.tab-btn{flex:1;padding:6px 0;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:white;color:var(--text3);box-shadow:var(--shadow)}
.tab-btn.active{background:var(--pink-deep);color:white}

/* MAIN STAGE — thỏ + speech bubble */
.stage{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;padding:0 16px;
}

/* Speech bubble trên đầu */
.speech-bubble{
  position:relative;
  background:white;
  border-radius:20px;
  padding:13px 18px;
  max-width:88%;
  min-height:52px;
  box-shadow:0 4px 18px rgba(212,83,126,0.18);
  font-size:15px;font-weight:700;line-height:1.5;
  color:var(--text);
  text-align:center;
  margin-bottom:16px;
  opacity:0;
  transform:translateY(6px) scale(0.97);
  transition:opacity .3s ease, transform .3s ease;
  word-break:break-word;
}
.speech-bubble.show{opacity:1;transform:translateY(0) scale(1)}
.speech-bubble::after{
  content:'';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:white;
  filter:drop-shadow(0 3px 3px rgba(212,83,126,0.1));
}
.speech-bubble.story-bubble{background:linear-gradient(135deg,#FFF8FB,#F3E5F5);border:1.5px solid var(--purple)}
.speech-bubble.story-bubble::after{border-top-color:#F3E5F5}

/* User echo — nhỏ hơn, màu hồng */
.user-echo{
  font-size:12px;font-weight:600;color:var(--text3);
  background:var(--pink-light);border-radius:999px;
  padding:4px 14px;margin-bottom:10px;
  max-width:80%;text-align:center;
  opacity:0;transition:opacity .25s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-echo.show{opacity:1}

/* Thỏ */
.bunny-wrap{position:relative;display:flex;align-items:center;justify-content:center}
#character{filter:drop-shadow(0 8px 20px rgba(212,83,126,0.25));transition:transform .1s}
#character.hop   {animation:hop .4s ease-in-out infinite alternate}
#character.wiggle{animation:wiggle .5s ease-in-out infinite alternate}
#character.bounce{animation:bounce .45s ease-in-out infinite alternate}
#character.shake {animation:shake .4s ease-in-out infinite alternate}
#character.nod   {animation:nod .6s ease-in-out infinite alternate}
@keyframes hop   {to{transform:translateY(-9px)}}
@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake {0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes nod   {from{transform:translateY(0)}to{transform:translateY(-5px)}}

/* Bong bóng cảm xúc nhỏ cạnh thỏ */
.emotion-bubble{
  position:absolute;top:0;right:-10px;
  background:white;border-radius:12px 12px 12px 3px;
  padding:4px 8px;font-size:18px;
  box-shadow:var(--shadow);
  opacity:0;transform:scale(.4);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
.emotion-bubble.show{opacity:1;transform:scale(1)}

/* Status pill */
.status-pill{
  margin-top:12px;padding:5px 18px;border-radius:999px;
  background:white;box-shadow:var(--shadow);
  font-size:12px;font-weight:700;color:var(--pink-deep);text-align:center;
  min-width:160px;
}

/* BOTTOM */
.bottom-panel{flex:0 0 auto;padding:4px 14px 0}
.panel-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.chip-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:999px;border:none;background:white;color:var(--text2);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;transition:all .15s}
.chip.active{background:var(--pink-deep);color:white}
.chip.story-chip{background:var(--purple-light);color:#7B1FA2}
.chip.story-chip.active{background:#7B1FA2;color:white}

/* MIC */
.controls-area{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,var(--pink-light) 0%,transparent 100%);
}
.mic-btn{width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 20px rgba(212,83,126,.45);transition:all .15s;touch-action:manipulation}
.mic-btn:active{transform:scale(.9)}
.mic-btn.recording{background:#c62828;animation:pulseMic 1s infinite}
.mic-btn.story-mode{background:#7B1FA2;box-shadow:0 5px 18px rgba(123,31,162,.4)}
@keyframes pulseMic{0%,100%{box-shadow:0 5px 18px rgba(198,40,40,.35)}50%{box-shadow:0 5px 36px rgba(198,40,40,.7)}}
.mic-svg{width:28px;height:28px;fill:white}
.mic-hint{margin-top:5px;font-size:11px;font-weight:700;color:var(--text3)}
.error-msg{margin-top:3px;font-size:11px;font-weight:600;color:#c62828;text-align:center;min-height:14px;padding:0 12px}

/* Auto-listen ring */
.mic-btn.auto-waiting::after{
  content:'';position:absolute;border-radius:50%;
  width:80px;height:80px;top:-7px;left:-7px;
  border:3px solid var(--pink);
  animation:autoRing 1.6s ease-in-out infinite;
  pointer-events:none;
}
.mic-btn{position:relative}
@keyframes autoRing{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:.2}}
</style>
</head>

<script>
const MIC_ON  = '<path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/>';

// ── VOICE SELECTION ──────────────────────────────────────────────
function loadVoices(){
  voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;

  // Ưu tiên: Google > Microsoft > mặc định; female > male; local > remote
  function scoreVoice(v, langCode, preferHighPitch){
    let score=0;
    if(v.lang.startsWith(langCode))score+=100;
    const n=v.name.toLowerCase();
    if(n.includes('google'))score+=40;
    if(n.includes('microsoft'))score+=30;
    // Giọng nữ / nhẹ nhàng → ưu tiên cho kid
    if(preferHighPitch){
      if(n.includes('female')||n.includes('girl')||n.includes('zira')||n.includes('samantha')||n.includes('victoria')||n.includes('fiona')||n.includes('ava')||n.includes('hazel')||n.includes('susan')||n.includes('amelie')||n.includes('nora')||n.includes('sara')||n.includes('karen'))score+=20;
    }
    if(!v.localService)score-=5; // local thường mượt hơn
    return score;
  }

  const viVoices = voices.filter(v=>v.lang.startsWith('vi'));
  const enVoices = voices.filter(v=>v.lang.startsWith('en'));

  // Kid voice: vi-VN hoặc en cao nhất
  const langCode = lang==='vi'?'vi':'en';
  const useKidLang = lang==='vi'?viVoices:enVoices;
  if(useKidLang.length){
    kidVoice=useKidLang.sort((a,b)=>scoreVoice(b,langCode,true)-scoreVoice(a,langCode,true))[0];
  }
  // Adult voice: tương tự nhưng không cần ưu tiên giọng nữ
  adultVoice=kidVoice;
}

window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

// ── EMOTION ───────────────────────────────────────────────────────
function applyEmotion(name,showBubble){
  const e=EMOTIONS[name]||EMOTIONS.happy;
  currentEmotion=name;
  g('mouth').setAttribute('d',e.mouth);
  g('brow-l').setAttribute('d',e.browL);
  g('brow-r').setAttribute('d',e.browR);
  ['l','r'].forEach(s=>{
    g('eye-'+s+'-iris').setAttribute('ry',e.eyeRy);
    g('eye-'+s+'-white').setAttribute('ry',e.eyeRy+3);
    g('eye-'+s+'-iris').setAttribute('cy',e.eyeCy);
    g('eye-'+s+'-white').setAttribute('cy',e.eyeCy);
  });
  g('cheek-l').setAttribute('opacity',e.cheek);
  g('cheek-r').setAttribute('opacity',e.cheek);
  g('stars').setAttribute('opacity',e.stars);
  g('hearts').setAttribute('opacity',e.hearts);
  g('zzz').setAttribute('opacity',e.zzz);
  g('sweat').setAttribute('rx',e.sweat?4:0);
  g('sweat').setAttribute('ry',e.sweat?6:0);
  const c=g('character');
  c.className.baseVal='';
  if(e.anim){void c.offsetWidth;c.classList.add(e.anim);}
  if(showBubble){
    const b=g('emotion-bubble');
    b.textContent=e.emoji;b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'),1800);
  }
}

function detectEmotion(text){
  const t=text.toLowerCase();
  if(/giỏi|tuyệt|xuất sắc|hay lắm|đúng rồi|great|excellent|well done|good job|amazing|wonderful/.test(t))return'excited';
  if(/yêu|thương|gia đình|bạn bè|love|family|friend|cute/.test(t))return'love';
  if(/haha|hihi|buồn cười|funny|laugh|hehe/.test(t))return'laugh';
  if(/ồ|ôi|wow|ngạc nhiên|bất ngờ|oh|whoa|really/.test(t))return'surprised';
  if(/[?？]/.test(text)&&text.length<80)return'surprised';
  return'happy';
}
function extractEmotionTag(text){const m=text.match(/\[(happy|excited|surprised|love|laugh)\]/i);return m?m[1].toLowerCase():null}
function stripEmotionTag(text){return text.replace(/\[(happy|excited|surprised|love|laugh)\]/gi,'').trim()}

// ── SPEECH BUBBLE ─────────────────────────────────────────────────
let bubbleHideTimer=null;
function showSpeechBubble(text, isStory){
  clearTimeout(bubbleHideTimer);
  const b=g('speech-bubble');
  b.textContent=text;
  b.className='speech-bubble'+(isStory?' story-bubble':'');
  // force reflow để animation chạy lại
  void b.offsetWidth;
  b.classList.add('show');
}
function hideSpeechBubble(delay){
  clearTimeout(bubbleHideTimer);
  bubbleHideTimer=setTimeout(()=>{
    g('speech-bubble').classList.remove('show');
  }, delay||3000);
}

function showUserEcho(text){
  const e=g('user-echo');
  e.textContent='🗣 '+text;
  e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),3000);
}

function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>applyEmotion('sleepy',true),35000);
}

// ── UI CONTROLS ───────────────────────────────────────────────────
function setTab(t,btn){
  tab=t;selectedChip=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  g('mic-btn').classList.toggle('story-mode',t==='story');
  renderPanel();resetChat();
}
function setMode(m,btn){
  mode=m;selectedChip=null;chatHistory=[];
  g('mode-toggle').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');loadVoices();renderPanel();resetChat();
}
function setLang(l,btn){
  lang=l;selectedChip=null;chatHistory=[];storyHistory=[];
  g('lang-toggle').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(recognition)recognition.lang=l==='vi'?'vi-VN':'en-US';
  loadVoices();renderPanel();resetChat();
}
function resetChat(){
  // Dừng auto-listen khi reset
  autoListen=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  isRecording=false; isSpeaking=false;
  window.speechSynthesis.cancel();

  const gr=tab==='story'?GREET.story[lang]:GREET.chat[mode][lang];
  showSpeechBubble(gr,false);
  hideSpeechBubble(7000);
  setStatus(lang==='vi'?'Nhấn mic để bắt đầu! 🎤':'Tap mic to start! 🎤');
  setError('');applyEmotion('happy',false);
  updateMicUI();resetIdleTimer();
}
function renderPanel(){
  if(tab==='chat'){
    g('panel-label').textContent=lang==='vi'?'Chủ đề':'Topics';
    g('chip-row').innerHTML=TOPICS[mode][lang].map((t,i)=>
      '<button class="chip'+(selectedChip===i?' active':'')+'" onclick="selectTopic('+i+',\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>'
    ).join('');
  }else{
    g('panel-label').textContent=lang==='vi'?'Chọn truyện':'Choose a story';
    g('chip-row').innerHTML=STORIES[lang].map((t,i)=>
      '<button class="chip story-chip'+(selectedChip===i?' active':'')+'" onclick="selectStory('+i+',\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>'
    ).join('');
  }
}
function selectTopic(i,t){
  selectedChip=i;renderPanel();
  callAI(lang==='vi'?'Hãy bắt đầu nói chuyện về chủ đề: '+t:'Let\'s talk about: '+t,true,false);
}
function selectStory(i,t){
  selectedChip=i;renderPanel();storyHistory=[];
  applyEmotion('excited',true);
  callAI(lang==='vi'?'Hãy bắt đầu kể chuyện "'+t+'" cho bé nghe! Kể phần mở đầu trước nhé!':'Please start telling the story "'+t+'"! Begin with the opening!',true,true);
}

// ── MIC BUTTON STATE ─────────────────────────────────────────────
function updateMicUI(){
  const btn=g('mic-btn');
  const hint=g('mic-hint');
  if(isSpeaking){
    // Mimi đang nói → hiện nút Stop
    btn.classList.remove('recording','auto-waiting');
    g('mic-icon').innerHTML=MIC_STOP;
    hint.textContent=lang==='vi'?'Nhấn để ngắt':'Tap to stop';
  } else if(isRecording){
    // Đang nghe giọng người dùng
    btn.classList.add('recording');btn.classList.remove('auto-waiting');
    g('mic-icon').innerHTML=MIC_OFF;
    hint.textContent=lang==='vi'?'🎙 Đang nghe...':'🎙 Listening...';
  } else if(autoListen){
    // Auto mode — chờ nghe
    btn.classList.remove('recording');btn.classList.add('auto-waiting');
    g('mic-icon').innerHTML=MIC_ON;
    hint.textContent=lang==='vi'?'Tự động nghe 🔄':'Auto listening 🔄';
  } else {
    // Thủ công — chưa bắt đầu
    btn.classList.remove('recording','auto-waiting');
    g('mic-icon').innerHTML=MIC_ON;
    hint.textContent=lang==='vi'?'Nhấn để bắt đầu':'Tap to start';
  }
}

// ── RECORDING ─────────────────────────────────────────────────────
function toggleRecording(){
  if(isWaiting)return;

  if(isSpeaking){
    // Ngắt Mimi đang nói
    window.speechSynthesis.cancel();
    isSpeaking=false;
    applyEmotion('happy',false);
    if(autoListen) setTimeout(startAutoRecognition, 400);
    else updateMicUI();
    return;
  }

  if(autoListen){
    // Tắt auto-listen
    autoListen=false;
    if(recognition){try{recognition.stop();}catch(e){}}
    isRecording=false;
    setStatus(lang==='vi'?'Đã tắt tự nghe':'Auto-listen off');
    updateMicUI();
    return;
  }

  // Lần đầu bấm → bật auto-listen
  autoListen=true;
  startAutoRecognition();
  resetIdleTimer();
}

let silenceTimer=null;
let accumulatedText='';

function startAutoRecognition(){
  if(!autoListen||isWaiting||isSpeaking||isRecording)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setError('Vui lòng dùng Chrome.');autoListen=false;updateMicUI();return;}
  setError('');

  try{
    recognition=new SR();
    recognition.lang=lang==='vi'?'vi-VN':'en-US';
    recognition.continuous=true;       // liên tục để kiểm soát silence thủ công
    recognition.interimResults=true;   // nhận interim để biết user đang nói

    recognition.onstart=function(){
      isRecording=true;
      accumulatedText='';
      applyEmotion('listening',false);
      setStatus(lang==='vi'?'🎙 Đang nghe...':'🎙 Listening...');
      hideSpeechBubble(300);
      updateMicUI();
    };

    recognition.onresult=function(e){
      // Gom tất cả kết quả final
      let newFinal='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) newFinal+=e.results[i][0].transcript;
      }
      if(!newFinal) return; // chỉ interim, bỏ qua

      accumulatedText+=newFinal;
      clearTimeout(silenceTimer);

      // Dừng 500ms sau khi nhận final cuối cùng → gửi lên AI
      silenceTimer=setTimeout(()=>{
        const text=accumulatedText.trim();
        if(!text) return;
        accumulatedText='';
        try{recognition.stop();}catch(err){}
        isRecording=false;
        showUserEcho(text);
        callAI(text,false,tab==='story');
        resetIdleTimer();
        updateMicUI();
      }, 500);
    };

    recognition.onerror=function(e){
      clearTimeout(silenceTimer);
      accumulatedText='';
      isRecording=false;
      if(e.error==='not-allowed'){
        autoListen=false;
        setError('Cần cấp quyền micro.');
      }
      updateMicUI();
      // Restart nếu lỗi thường (no-speech, network...)
      if(autoListen&&!isWaiting&&!isSpeaking&&e.error!=='not-allowed'){
        setTimeout(startAutoRecognition,400);
      }
    };

    recognition.onend=function(){
      clearTimeout(silenceTimer);
      isRecording=false;
      updateMicUI();
      if(autoListen&&!isWaiting&&!isSpeaking){
        setTimeout(startAutoRecognition,350);
      }
    };

    recognition.start();
  }catch(err){
    isRecording=false;
    if(autoListen&&!isWaiting&&!isSpeaking) setTimeout(startAutoRecognition,500);
  }
}

// ── CALL AI ───────────────────────────────────────────────────────
function callAI(userText,isSystem,isStory){
  if(isWaiting)return;
  isWaiting=true;
  applyEmotion('thinking',true);
  showSpeechBubble(lang==='vi'?'Mimi đang nghĩ... 💭':'Thinking... 💭', false);

  let history=isStory?storyHistory:chatHistory;
  if(!isSystem)history.push({role:'user',content:userText});
  const messages=isSystem?[{role:'user',content:userText}]:history.slice();

  const body=isStory
    ?{type:'story',lang:lang,messages:messages}
    :{type:'chat',mode:mode,lang:lang,messages:messages};

  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  })
  .then(r=>r.json())
  .then(function(result){
    isWaiting=false;
    let raw=result.text||(lang==='vi'?'Mimi chưa hiểu, nói lại nhé!':"Mimi didn't catch that!");
    const tag=extractEmotionTag(raw);
    const clean=stripEmotionTag(raw);
    applyEmotion(tag||detectEmotion(clean),true);
    showSpeechBubble(clean, isStory);
    history.push({role:'assistant',content:clean});
    if(history.length>30){if(isStory)storyHistory=history.slice(-30);else chatHistory=history.slice(-30);}
    setStatus(lang==='vi'?'🔊 Mimi đang nói...':'🔊 Mimi is speaking...');
    speak(clean, isStory);
  })
  .catch(function(){
    isWaiting=false;
    showSpeechBubble(lang==='vi'?'Có lỗi kết nối, thử lại nhé!':'Connection error, try again!', false);
    applyEmotion('surprised',true);setStatus('');
    hideSpeechBubble(4000);
  });
}

// ── SPEAK ─────────────────────────────────────────────────────────
// Tách text thành chunks với pause phù hợp dấu câu
function buildChunks(text){
  const chunks=[];
  // Tách câu theo dấu kết thúc
  const sentences=text.split(/(?<=[.!?…])\s+|(?<=[.!?…])$/).filter(s=>s.trim());
  if(!sentences.length) return [{text:text.trim(), pause:400}];

  sentences.forEach(sentence=>{
    const s=sentence.trim();
    if(!s) return;
    // Pause cuối câu dựa vào dấu
    let endPause=420;
    if(s.endsWith('!')) endPause=320;
    if(s.endsWith('?')) endPause=520;
    if(s.endsWith('...')||s.endsWith('…')) endPause=750;

    // Tách thêm theo dấu phẩy nếu câu dài (>6 từ)
    const parts=s.split(/,\s*/);
    if(parts.length>1 && s.split(' ').length>6){
      parts.forEach((part,i)=>{
        const p=part.trim();
        if(!p) return;
        chunks.push({text:p, pause: i===parts.length-1 ? endPause : 210});
      });
    } else {
      chunks.push({text:s, pause:endPause});
    }
  });
  return chunks.length ? chunks : [{text:text.trim(), pause:400}];
}

function speak(text, isStory){
  window.speechSynthesis.cancel();
  const chunks=buildChunks(text);
  let idx=0;

  function speakNext(){
    if(idx>=chunks.length){
      isSpeaking=false;
      if(currentEmotion!=='sleepy') applyEmotion('happy',false);
      hideSpeechBubble(6000);
      resetIdleTimer();
      updateMicUI();
      // Auto-listen: bắt đầu nghe lại sau khi Mimi nói xong
      if(autoListen) setTimeout(startAutoRecognition, 500);
      else setStatus(lang==='vi'?'Nhấn mic để trả lời! 🎤':'Press mic to reply! 🎤');
      return;
    }
    const {text:chunk, pause}=chunks[idx++];
    if(!chunk){speakNext();return;}

    const u=new SpeechSynthesisUtterance(chunk);
    u.lang=lang==='vi'?'vi-VN':'en-US';

    // Chọn giọng phù hợp
    if(kidVoice&&(mode==='kid'||isStory)) u.voice=kidVoice;
    else if(adultVoice) u.voice=adultVoice;

    // Rate & pitch: kid chậm + cao hơn, adult bình thường
    if(mode==='kid'||isStory){ u.rate=0.78; u.pitch=1.28; }
    else { u.rate=0.90; u.pitch=1.05; }

    // Điều chỉnh theo cảm xúc
    if(currentEmotion==='excited'||currentEmotion==='laugh'){ u.rate+=0.07; u.pitch+=0.12; }
    if(currentEmotion==='sleepy'){ u.rate-=0.13; u.pitch-=0.1; }
    if(currentEmotion==='surprised'){ u.pitch+=0.18; }

    u.onend=function(){ setTimeout(speakNext, pause); };
    u.onerror=function(){ speakNext(); };
    window.speechSynthesis.speak(u);
  }

  isSpeaking=true;
  updateMicUI();
  speakNext();
}

// ── INIT ──────────────────────────────────────────────────────────
// Đăng ký Service Worker (PWA)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

renderPanel();
applyEmotion('happy',false);
resetChat();
resetIdleTimer();
</script>
