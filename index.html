<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#FFF0F5"/>
<title>Rainbow</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#F48FB1;--pink-light:#FCE4EC;--pink-deep:#D4537E;
  --purple:#CE93D8;--purple-light:#F3E5F5;
  --bg:#FFF0F5;--text:#3a1a2e;--text2:#7a4a65;--text3:#b08090;
  --shadow:0 2px 10px rgba(212,83,126,0.13);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text)}

/* SHELL */
#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
  background:var(--bg);
}

/* HEADER GROUP */
.header{flex:0 0 auto;background:linear-gradient(180deg,var(--pink-light),var(--bg))}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:6px}
.app-title{font-size:16px;font-weight:800;color:var(--pink-deep);flex-shrink:0}
.toggle-group{display:flex;background:white;border-radius:999px;padding:2px;gap:2px;box-shadow:var(--shadow)}
.toggle-btn{padding:4px 9px;border-radius:999px;border:none;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);white-space:nowrap}
.toggle-btn.active{background:var(--pink);color:white}
.tab-bar{display:flex;padding:2px 12px 6px;gap:6px}
.tab-btn{flex:1;padding:6px 0;border-radius:10px;border:none;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:white;color:var(--text3);box-shadow:var(--shadow)}
.tab-btn.active{background:var(--pink-deep);color:white}

/* CHARACTER */
.character-area{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:4px 0 2px;position:relative}
#character{filter:drop-shadow(0 4px 9px rgba(212,83,126,0.2))}
#character.hop   {animation:hop .4s ease-in-out infinite alternate}
#character.wiggle{animation:wiggle .5s ease-in-out infinite alternate}
#character.bounce{animation:bounce .45s ease-in-out infinite alternate}
#character.shake {animation:shake .4s ease-in-out infinite alternate}
#character.nod   {animation:nod .6s ease-in-out infinite alternate}
@keyframes hop   {to{transform:translateY(-6px)}}
@keyframes wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake {0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes nod   {from{transform:translateY(0)}to{transform:translateY(-4px)}}
.emotion-bubble{position:absolute;top:0;left:calc(50% + 38px);background:white;border-radius:12px 12px 12px 3px;padding:3px 7px;font-size:15px;box-shadow:var(--shadow);opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:10}
.emotion-bubble.show{opacity:1;transform:scale(1)}
.status-pill{margin-top:2px;padding:3px 14px;border-radius:999px;background:white;box-shadow:var(--shadow);font-size:11px;font-weight:700;color:var(--pink-deep);text-align:center}

/* CHAT */
.chat-box{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chat-box::-webkit-scrollbar{width:3px}
.chat-box::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:2px}
.bubble{max-width:85%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;font-weight:600;word-break:break-word;animation:popIn .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.user{align-self:flex-end;background:var(--pink);color:white;border-radius:16px 16px 3px 16px}
.bubble.ai{align-self:flex-start;background:white;color:var(--text);border-radius:16px 16px 16px 3px;box-shadow:var(--shadow)}
.bubble.thinking{color:var(--text3);font-style:italic}
.bubble.story{background:linear-gradient(135deg,#FFF8FB,#F3E5F5);border-left:3px solid var(--purple)}

/* BOTTOM */
.bottom-panel{flex:0 0 auto;padding:5px 12px 3px}
.panel-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.chip-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 11px;border-radius:999px;border:none;background:white;color:var(--text2);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;transition:all .15s}
.chip.active{background:var(--pink-deep);color:white}
.chip.story-chip{background:var(--purple-light);color:#7B1FA2}
.chip.story-chip.active{background:#7B1FA2;color:white}

.controls-area{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 16px 14px;background:linear-gradient(0deg,var(--pink-light),var(--bg))}
.mic-btn{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px rgba(212,83,126,.4);transition:all .15s;touch-action:manipulation}
.mic-btn:active{transform:scale(.92)}
.mic-btn.recording{background:#c62828;animation:pulseMic 1s infinite}
.mic-btn.story-mode{background:#7B1FA2;box-shadow:0 5px 18px rgba(123,31,162,.4)}
@keyframes pulseMic{0%,100%{box-shadow:0 5px 18px rgba(198,40,40,.35)}50%{box-shadow:0 5px 32px rgba(198,40,40,.65)}}
.mic-svg{width:26px;height:26px;fill:white}
.mic-hint{margin-top:4px;font-size:11px;font-weight:700;color:var(--text3)}
.error-msg{margin-top:3px;font-size:11px;font-weight:600;color:#c62828;text-align:center;min-height:14px;padding:0 12px}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="top-bar">
      <div class="app-title">🌈 Rainbow</div>
      <div class="toggle-group" id="mode-toggle">
        <button class="toggle-btn active" onclick="setMode('kid',this)">Bé 👶</button>
        <button class="toggle-btn" onclick="setMode('adult',this)">Bố mẹ 👨‍👩‍👧</button>
      </div>
      <div class="toggle-group" id="lang-toggle">
        <button class="toggle-btn active" onclick="setLang('vi',this)">🇻🇳</button>
        <button class="toggle-btn" onclick="setLang('en',this)">🇬🇧</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('chat',this)">💬 Trò chuyện</button>
      <button class="tab-btn" onclick="setTab('story',this)">📖 Kể chuyện</button>
    </div>
  </div>

  <!-- CHARACTER -->
  <div class="character-area">
    <div class="emotion-bubble" id="emotion-bubble">😊</div>
    <svg id="character" width="92" height="105" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="42" cy="38" rx="13" ry="30" fill="#F4C0D1" stroke="#ED93B1" stroke-width="1"/>
      <ellipse cx="42" cy="40" rx="7" ry="22" fill="#FBEAF0"/>
      <ellipse cx="88" cy="38" rx="13" ry="30" fill="#F4C0D1" stroke="#ED93B1" stroke-width="1"/>
      <ellipse cx="88" cy="40" rx="7" ry="22" fill="#FBEAF0"/>
      <ellipse cx="65" cy="68" rx="46" ry="14" fill="#ED93B1"/>
      <path d="M 19 72 Q 16 120 65 124 Q 114 120 111 72 Q 90 82 65 82 Q 40 82 19 72Z" fill="#ED93B1"/>
      <circle cx="65" cy="75" r="38" fill="white" stroke="#F4C0D1" stroke-width="1"/>
      <ellipse id="cheek-l" cx="44" cy="82" rx="9" ry="6" fill="#F4C0D1" opacity="0.7"/>
      <ellipse id="cheek-r" cx="86" cy="82" rx="9" ry="6" fill="#F4C0D1" opacity="0.7"/>
      <g id="eye-left">
        <ellipse id="eye-l-white" cx="54" cy="70" rx="8" ry="9" fill="white"/>
        <ellipse id="eye-l-iris" cx="54" cy="71" rx="5" ry="6" fill="#3C3489"/>
        <circle cx="55.5" cy="69" r="2" fill="white"/>
      </g>
      <g id="eye-right">
        <ellipse id="eye-r-white" cx="76" cy="70" rx="8" ry="9" fill="white"/>
        <ellipse id="eye-r-iris" cx="76" cy="71" rx="5" ry="6" fill="#3C3489"/>
        <circle cx="77.5" cy="69" r="2" fill="white"/>
      </g>
      <path id="brow-l" d="M 47 62 Q 54 59 61 62" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path id="brow-r" d="M 69 62 Q 76 59 83 62" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="65" cy="80" rx="3.5" ry="2.5" fill="#D4537E"/>
      <path id="mouth" d="M 55 86 Q 65 94 75 86" stroke="#D4537E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 48 108 Q 65 118 82 108" stroke="#D4537E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 57 112 Q 60 106 65 110 Q 70 106 73 112 Q 65 116 57 112Z" fill="#D4537E" opacity="0.8"/>
      <circle cx="65" cy="112" r="3" fill="#993556"/>
      <ellipse cx="42" cy="126" rx="12" ry="8" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.5"/>
      <ellipse cx="88" cy="126" rx="12" ry="8" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.5"/>
      <g id="stars" opacity="0">
        <text x="16" y="54" font-size="13" fill="#FFD700">✦</text>
        <text x="100" y="44" font-size="11" fill="#FFD700">✦</text>
      </g>
      <g id="hearts" opacity="0">
        <text x="12" y="48" font-size="13">🤍</text>
        <text x="102" y="52" font-size="11">🤍</text>
      </g>
      <g id="zzz" opacity="0">
        <text x="90" y="50" font-size="11" fill="#9E9E9E" font-weight="bold">z</text>
        <text x="98" y="43" font-size="9" fill="#9E9E9E" font-weight="bold">z</text>
        <text x="104" y="37" font-size="7" fill="#9E9E9E" font-weight="bold">z</text>
      </g>
      <ellipse id="sweat" cx="88" cy="58" rx="0" ry="0" fill="#B3E5FC"/>
    </svg>
    <div class="status-pill" id="status-text">Nhấn mic để nói! 🎤</div>
  </div>

  <!-- CHAT -->
  <div class="chat-box" id="chat-box">
    <div class="bubble ai">Xin chào! Mình là Rainbow 🌈 Hôm nay mình sẽ nói chuyện và luyện tiếng Anh cùng bạn nhé!</div>
  </div>

  <!-- BOTTOM PANEL -->
  <div class="bottom-panel">
    <div class="panel-label" id="panel-label">Chủ đề</div>
    <div class="chip-row" id="chip-row"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-area">
    <button class="mic-btn" id="mic-btn" onclick="toggleRecording()" aria-label="Nhấn để nói">
      <svg id="mic-icon" class="mic-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/>
      </svg>
    </button>
    <div class="mic-hint" id="mic-hint">Nhấn để nói</div>
    <div class="error-msg" id="error-msg"></div>
  </div>

</div>

<script>
const MIC_ON ='<path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/>';
const MIC_OFF='<line x1="1" y1="1" x2="23" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V5a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>';

let mode='kid',lang='vi',tab='chat';
let isRecording=false,isSpeaking=false,isWaiting=false;
let recognition=null,chatHistory=[],storyHistory=[],selectedChip=null;
let idleTimer=null,currentEmotion='happy';

const TOPICS={
  kid:  {vi:['Con vật 🐶','Màu sắc 🎨','Đồ ăn 🍎','Gia đình 👨‍👩‍👧','Đồ chơi 🧸','Siêu anh hùng 🦸'],en:['Animals 🐶','Colors 🎨','Food 🍎','Family 👨‍👩‍👧','Toys 🧸','Superheroes 🦸']},
  adult:{vi:['Nấu ăn 🍳','Đi chợ 🛒','Thời tiết ☀️','Công việc 💼','Du lịch ✈️','Sức khỏe 💊'],   en:['Cooking 🍳','Shopping 🛒','Weather ☀️','Work 💼','Travel ✈️','Health 💊']}
};
const STORIES={
  vi:['Tấm Cám','Sơn Tinh Thủy Tinh','Khăn đỏ','Ba chú lợn','Bạch Tuyết','Lọ Lem','Vịt con xấu xí','Pinocchio','Alibaba','Nàng tiên cá'],
  en:['Red Riding Hood','Three Pigs','Snow White','Cinderella','Ugly Duckling','Pinocchio','Goldilocks','Jack & Beanstalk','Little Mermaid','Sleeping Beauty']
};
const GREET={
  chat:{kid:{vi:'Xin chào! Mình là Rainbow 🌈 Hôm nay mình muốn chơi và nói chuyện cùng bạn!',en:"Hello! I'm Rainbow 🌈 Let's talk and play together!"},adult:{vi:'Chào bạn! Mình là Rainbow 🌈 Cùng luyện tiếng Anh qua chuyện hàng ngày nhé!',en:"Hi! I'm Rainbow 🌈 Let's practice English through daily conversations!"}},
  story:{vi:'Chào bạn nhỏ! Mình là Rainbow 🌈 Chọn một câu chuyện bên dưới để mình kể nhé! 📖',en:"Hello! I'm Rainbow 🌈 Pick a story below and I'll tell it! 📖"}
};

const EMOTIONS={
  happy:    {emoji:'😊',anim:'nod',   mouth:'M 55 86 Q 65 94 75 86',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:0.7,stars:0,hearts:0,sweat:0,zzz:0},
  excited:  {emoji:'🤩',anim:'bounce',mouth:'M 50 84 Q 65 98 80 84',browL:'M 46 60 Q 54 56 62 60',browR:'M 68 60 Q 76 56 84 60',eyeRy:7,eyeCy:70,cheek:1,stars:1,hearts:0,sweat:0,zzz:0},
  surprised:{emoji:'😮',anim:'shake', mouth:'M 58 85 Q 65 95 72 85',browL:'M 46 59 Q 54 55 62 58',browR:'M 68 58 Q 76 55 84 59',eyeRy:8,eyeCy:70,cheek:0.5,stars:0,hearts:0,sweat:1,zzz:0},
  love:     {emoji:'🥰',anim:'nod',   mouth:'M 52 86 Q 65 96 78 86',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:1,stars:0,hearts:1,sweat:0,zzz:0},
  laugh:    {emoji:'😂',anim:'bounce',mouth:'M 50 83 Q 65 99 80 83',browL:'M 46 60 Q 54 56 62 60',browR:'M 68 60 Q 76 56 84 60',eyeRy:3,eyeCy:72,cheek:1,stars:0,hearts:0,sweat:0,zzz:0},
  thinking: {emoji:'🤔',anim:'wiggle',mouth:'M 55 88 Q 63 86 72 90',browL:'M 47 62 Q 54 65 61 62',browR:'M 69 59 Q 76 56 83 62',eyeRy:5,eyeCy:71,cheek:0.5,stars:0,hearts:0,sweat:0,zzz:0},
  listening:{emoji:'👂',anim:'wiggle',mouth:'M 57 88 Q 65 92 73 88',browL:'M 47 62 Q 54 59 61 62',browR:'M 69 62 Q 76 59 83 62',eyeRy:6,eyeCy:71,cheek:0.7,stars:0,hearts:0,sweat:0,zzz:0},
  sleepy:   {emoji:'😴',anim:'',      mouth:'M 57 88 Q 65 90 73 88',browL:'M 47 64 Q 54 62 61 64',browR:'M 69 64 Q 76 62 83 64',eyeRy:3,eyeCy:73,cheek:0.4,stars:0,hearts:0,sweat:0,zzz:1}
};

function g(id){return document.getElementById(id)}
function setStatus(t){g('status-text').textContent=t}
function setError(t){g('error-msg').textContent=t}
function setMicIcon(on){g('mic-icon').innerHTML=on?MIC_ON:MIC_OFF}

function applyEmotion(name,showBubble){
  const e=EMOTIONS[name]||EMOTIONS.happy;
  currentEmotion=name;
  g('mouth').setAttribute('d',e.mouth);
  g('brow-l').setAttribute('d',e.browL);
  g('brow-r').setAttribute('d',e.browR);
  ['l','r'].forEach(s=>{
    g('eye-'+s+'-iris').setAttribute('ry',e.eyeRy);
    g('eye-'+s+'-white').setAttribute('ry',e.eyeRy+3);
    g('eye-'+s+'-iris').setAttribute('cy',e.eyeCy);
    g('eye-'+s+'-white').setAttribute('cy',e.eyeCy);
  });
  g('cheek-l').setAttribute('opacity',e.cheek);
  g('cheek-r').setAttribute('opacity',e.cheek);
  g('stars').setAttribute('opacity',e.stars);
  g('hearts').setAttribute('opacity',e.hearts);
  g('zzz').setAttribute('opacity',e.zzz);
  g('sweat').setAttribute('rx',e.sweat?4:0);
  g('sweat').setAttribute('ry',e.sweat?6:0);
  const c=g('character');
  c.className.baseVal='';
  if(e.anim){void c.offsetWidth;c.classList.add(e.anim);}
  if(showBubble){
    const b=g('emotion-bubble');
    b.textContent=e.emoji;b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'),1800);
  }
}

function detectEmotion(text){
  const t=text.toLowerCase();
  if(/giỏi|tuyệt|xuất sắc|hay lắm|đúng rồi|great|excellent|well done|good job|amazing|wonderful/.test(t))return'excited';
  if(/yêu|thương|gia đình|bạn bè|love|family|friend|cute/.test(t))return'love';
  if(/haha|hihi|buồn cười|funny|laugh|hehe/.test(t))return'laugh';
  if(/ồ|ôi|wow|ngạc nhiên|bất ngờ|oh|whoa|really/.test(t))return'surprised';
  if(/[?？]/.test(text)&&text.length<80)return'surprised';
  return'happy';
}
function extractEmotionTag(text){const m=text.match(/\[(happy|excited|surprised|love|laugh)\]/i);return m?m[1].toLowerCase():null}
function stripEmotionTag(text){return text.replace(/\[(happy|excited|surprised|love|laugh)\]/gi,'').trim()}

function addBubble(text,who,thinking,isStory){
  const box=g('chat-box');
  const div=document.createElement('div');
  div.className='bubble '+who+(thinking?' thinking':'')+(isStory?' story':'');
  div.textContent=text;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
  return div;
}
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>applyEmotion('sleepy',true),30000);
}

function setTab(t,btn){
  tab=t;selectedChip=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  g('mic-btn').classList.toggle('story-mode',t==='story');
  renderPanel();resetChat();
}
function setMode(m,btn){
  mode=m;selectedChip=null;chatHistory=[];
  g('mode-toggle').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderPanel();resetChat();
}
function setLang(l,btn){
  lang=l;selectedChip=null;chatHistory=[];storyHistory=[];
  g('lang-toggle').querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(recognition)recognition.lang=l==='vi'?'vi-VN':'en-US';
  renderPanel();resetChat();
}
function resetChat(){
  const gr=tab==='story'?GREET.story[lang]:GREET.chat[mode][lang];
  g('chat-box').innerHTML='<div class="bubble ai">'+gr+'</div>';
  setStatus(lang==='vi'?'Nhấn mic để nói! 🎤':'Press mic to talk! 🎤');
  g('mic-hint').textContent=lang==='vi'?'Nhấn để nói':'Press to talk';
  setError('');applyEmotion('happy',false);resetIdleTimer();
}
function renderPanel(){
  if(tab==='chat'){
    g('panel-label').textContent=lang==='vi'?'Chủ đề':'Topics';
    g('chip-row').innerHTML=TOPICS[mode][lang].map((t,i)=>
      '<button class="chip'+(selectedChip===i?' active':'')+'" onclick="selectTopic('+i+',\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>'
    ).join('');
  }else{
    g('panel-label').textContent=lang==='vi'?'Chọn truyện':'Choose a story';
    g('chip-row').innerHTML=STORIES[lang].map((t,i)=>
      '<button class="chip story-chip'+(selectedChip===i?' active':'')+'" onclick="selectStory('+i+',\''+t.replace(/'/g,"\\'")+'\')">'+t+'</button>'
    ).join('');
  }
}
function selectTopic(i,t){
  selectedChip=i;renderPanel();
  callAI(lang==='vi'?'Hãy bắt đầu nói chuyện về chủ đề: '+t:'Let\'s talk about: '+t,true,false);
}
function selectStory(i,t){
  selectedChip=i;renderPanel();storyHistory=[];
  applyEmotion('excited',true);
  callAI(lang==='vi'?'Hãy bắt đầu kể chuyện "'+t+'" cho bé nghe! Kể phần mở đầu trước nhé!':'Please start telling the story "'+t+'"! Begin with the opening!',true,true);
}

function toggleRecording(){
  if(isWaiting)return;
  if(isSpeaking){window.speechSynthesis.cancel();isSpeaking=false;applyEmotion('happy',false);}
  isRecording?stopRecording():startRecording();
  resetIdleTimer();
}
function startRecording(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setError('Vui lòng dùng Chrome để dùng giọng nói.');return;}
  setError('');
  recognition=new SR();
  recognition.lang=lang==='vi'?'vi-VN':'en-US';
  recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=function(){
    isRecording=true;g('mic-btn').classList.add('recording');setMicIcon(false);
    setStatus(lang==='vi'?'🎙 Đang nghe...':'🎙 Listening...');
    applyEmotion('listening',false);
  };
  recognition.onresult=function(e){
    const text=e.results[0][0].transcript;
    stopRecording();addBubble(text,'user',false,false);
    callAI(text,false,tab==='story');resetIdleTimer();
  };
  recognition.onerror=function(e){
    stopRecording();
    setError(e.error==='not-allowed'?'Cần cấp quyền micro.':(lang==='vi'?'Không nghe rõ, thử lại!':'Could not hear, try again!'));
    applyEmotion('surprised',true);
  };
  recognition.onend=function(){if(isRecording)stopRecording();};
  recognition.start();
}
function stopRecording(){
  isRecording=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  g('mic-btn').classList.remove('recording');setMicIcon(true);
  setStatus(lang==='vi'?'Đang xử lý...':'Processing...');
}

// ── GỌI API (thay google.script.run bằng fetch) ──────────────────
function callAI(userText,isSystem,isStory){
  if(isWaiting)return;
  isWaiting=true;
  applyEmotion('thinking',true);
  const thinking=addBubble(lang==='vi'?'Rainbow đang nghĩ...':'Rainbow is thinking...','ai',true,false);
  let history=isStory?storyHistory:chatHistory;
  if(!isSystem)history.push({role:'user',content:userText});
  const messages=isSystem?[{role:'user',content:userText}]:history.slice();

  const body=isStory
    ?{type:'story',lang:lang,messages:messages}
    :{type:'chat',mode:mode,lang:lang,messages:messages};

  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  })
  .then(r=>r.json())
  .then(function(result){
    isWaiting=false;thinking.remove();
    let raw=result.text||(lang==='vi'?'Rainbow chưa hiểu, nói lại nhé!':"Rainbow didn't catch that!");
    const tag=extractEmotionTag(raw);
    const clean=stripEmotionTag(raw);
    applyEmotion(tag||detectEmotion(clean),true);
    addBubble(clean,'ai',false,isStory);
    history.push({role:'assistant',content:clean});
    if(history.length>30){if(isStory)storyHistory=history.slice(-30);else chatHistory=history.slice(-30);}
    setStatus(lang==='vi'?'🔊 Rainbow đang nói...':'🔊 Rainbow is speaking...');
    speak(clean);
  })
  .catch(function(){
    isWaiting=false;thinking.remove();
    addBubble(lang==='vi'?'Có lỗi kết nối, thử lại nhé!':'Connection error, try again!','ai',false,false);
    applyEmotion('surprised',true);setStatus('');
  });
}
// ─────────────────────────────────────────────────────────────────

function speak(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='vi'?'vi-VN':'en-US';
  u.rate=(mode==='kid'||tab==='story')?0.82:0.95;
  u.pitch=(mode==='kid'||tab==='story')?1.25:1.05;
  if(currentEmotion==='excited'||currentEmotion==='laugh')u.rate+=0.05;
  if(currentEmotion==='sleepy')u.rate-=0.1;
  isSpeaking=true;
  u.onend=function(){isSpeaking=false;if(currentEmotion!=='sleepy')applyEmotion('happy',false);setStatus(lang==='vi'?'Nhấn mic để trả lời! 🎤':'Press mic to reply! 🎤');resetIdleTimer();};
  u.onerror=function(){isSpeaking=false;};
  window.speechSynthesis.speak(u);
}

renderPanel();
applyEmotion('happy',false);
resetIdleTimer();
</script>
